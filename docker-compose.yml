version: '3.7'

# A test printer made of the same parts as a real one:
# - op: OctoPrint with this plugin (mounted from this checkout) and the
#   virtual printer. The plugin starts its own Janus and ffmpeg inside this
#   container, as it does on a real printer.
# - mjpeg: the camera, an MJPEG stream like crowsnest or mjpg-streamer on a
#   real printer. Point OctoPrint's webcam at http://mjpeg:8080/?action=stream
#   (snapshot http://mjpeg:8080/?action=snapshot).
services:
  op:
    hostname: octoprint
    restart: unless-stopped
    build:
        context: .
        dockerfile: Dockerfile.debian12
    ports:
      - "${OP_PYTHON3_PORT-5003}:5000"
    volumes:
     - ./:/app
    environment:
        DEBUG: 'True'
    depends_on:
      - mjpeg
    # Re-register the mounted checkout so OctoPrint reports its real version,
    # then run OctoPrint. To debug by hand instead, override the command with
    # `sleep infinity` and run `docker compose exec op ./start.sh`.
    command: bash -c "pip install -q --no-deps --no-build-isolation -e . && exec ./start.sh"

  mjpeg:
    hostname: mjpeg
    restart: unless-stopped
    image: thespaghettidetective/mjpg-streamer
    ports:
      - "${MJPEG_PORT-8080}:8080"
    command: sh -c "/mjpg-streamer/mjpg_streamer -o '/mjpg-streamer/output_http.so -w /mjpg-streamer/www' -i '/mjpg-streamer/input_file.so -f /mjpg-streamer/jpgs -e -d 1'"
